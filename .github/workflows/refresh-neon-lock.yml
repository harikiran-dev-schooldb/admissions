name: Refresh lockfile
on:
  workflow_dispatch:
  push:
    branches: ["feature/nextjs-admissions-redesign"]
    paths: ["package.json"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nextjs-admissions-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "lockfile: sync Neon Auth dependencies"
          git push origin HEAD:feature/nextjs-admissions-redesign
