name: CI

on:
  push:
    branches: ["main", "feature/nextjs-admissions-redesign"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admissions
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint app/api lib proxy.ts app/admissions/page.tsx app/admissions/analytics/page.tsx app/fees/page.tsx app/login/page.tsx app/layout.tsx app/page.tsx components/AppSidebar.tsx components/admissions/AdmissionsAnalytics.tsx components/fees/FeesKPISection.tsx components/fees/FeesTable.tsx hooks/useAdmissions.ts hooks/useFees.ts
      - run: npm run build
